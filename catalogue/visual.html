<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Album & Pressing Matcher</title>
  <style>
    :root {
      --bg: #121214;
      --card: #1c1c20;
      --border: #2e2e34;
      --accent: #ff6b35;
      --accent-hover: #ff8252;
      --text: #eaeaea;
      --text-muted: #9e9ea7;
      --badge-bg: #2a2a32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 { font-size: 1.4rem; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }
    .btn-exit-visual {
      flex-shrink: 0;
      padding: 8px 14px;
      background: #25252b;
      color: #eaeaea;
      border: 1px solid #3a3a44;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-exit-visual:hover {
      background: #421d24;
      border-color: #b91c1c;
      color: #fecaca;
    }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .field label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }
    input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      background: #0d0d0f;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }
    input[type="password"]:focus, select:focus {
      border-color: var(--accent);
    }

    /* Viewport */
    .viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, img#preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .viewport-guide {
      position: absolute;
      inset: 8%;
      border: 2px dashed rgba(255, 255, 255, 0.45);
      border-radius: 6px;
      pointer-events: none;
    }

    /* Controls */
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button, .file-label {
      background: #2a2a30;
      color: #fff;
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s ease, opacity 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active, .file-label:active { background: #373740; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    
    .btn-snap { background: #ffffff; color: #121214; border-color: #ffffff; }
    .btn-snap:active { background: #e0e0e0; }

    .file-label {
      grid-column: span 2;
      background: #222227;
      font-weight: 500;
      color: var(--text-muted);
    }
    input[type="file"] { display: none; }

    button.primary {
      grid-column: span 2;
      background: var(--accent);
      border-color: var(--accent);
      color: #121214;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px;
    }
    button.primary:active { background: var(--accent-hover); }

    #status {
      font-size: 0.8rem;
      color: var(--accent);
      min-height: 1.1rem;
      text-align: center;
      word-break: break-word;
      line-height: 1.4;
    }

    /* Results */
    .result-section {
      display: none;
      border-top: 1px solid var(--border);
      padding-top: 14px;
      flex-direction: column;
      gap: 12px;
    }
    .album-header { margin-bottom: 4px; }
    .album-title { font-size: 1.25rem; font-weight: 700; color: #fff; line-height: 1.2; }
    .album-artist { font-size: 1rem; color: var(--text-muted); margin-top: 2px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      background: var(--badge-bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      color: #ccc;
    }
    .tag-cat { color: var(--accent); font-weight: 600; }

    .tracklist {
      list-style-type: decimal;
      padding-left: 20px;
      font-size: 0.85rem;
      max-height: 220px;
      overflow-y: auto;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .tracklist li {
      color: #d0d0d5;
      padding-right: 8px;
      display: flex;
      justify-content: space-between;
    }
    .track-dur { color: var(--text-muted); font-size: 0.8rem; margin-left: 8px; }
    .discogs-link {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      display: inline-block;
      margin-top: 6px;
    }
    .discogs-link:hover { text-decoration: underline; }
    .qmc-export-box {
      margin-top: 8px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-qmc-apply {
      background: linear-gradient(90deg, #d4af37, #f59e0b);
      color: #111;
      border: 1px solid #f59e0b;
      font-weight: 800;
      font-size: 0.92rem;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    .btn-qmc-apply:hover { filter: brightness(1.06); }
    .qmc-embedded header { margin-bottom: 12px; }
    .qmc-embedded body, body.qmc-embedded { padding: 12px; }
    canvas { display: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Album & Pressing Matcher</h1>
      <p>Snap sleeve front, back barcode, or spine to identify the exact pressing.</p>
    </div>
    <button id="btnExitVisual" type="button" class="btn-exit-visual" title="Exit Visual Matcher and return to QMC Catalogue">✕ Exit</button>
  </header>

  <div class="card">
    <div class="field">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy...">
    </div>

    <div class="field">
      <label for="discogsToken">Discogs Token (Optional — For exact vinyl/CD pressings)</label>
      <input type="password" id="discogsToken" placeholder="Paste personal token from discogs.com/settings/developers">
    </div>

    <div class="viewport">
      <video id="webcam" autoplay playsinline webkit-playsinline muted style="display: none;"></video>
      <img id="preview" style="display: none;" alt="Cover Preview">
      <div class="viewport-guide"></div>
    </div>

    <div class="btn-grid">
      <button id="btnToggleCam" type="button">Start Camera</button>
      <button id="btnSnap" type="button" class="btn-snap" disabled>📸 Take Picture</button>
      <label class="file-label" for="fileInput">Choose from Photo Library</label>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <button id="btnScan" class="primary" type="button" disabled>Identify Release</button>
    </div>

    <div id="status"></div>

    <div id="resultBlock" class="result-section">
      <div class="album-header">
        <div id="resTitle" class="album-title"></div>
        <div id="resArtist" class="album-artist"></div>
        <div id="resTags" class="tags"></div>
      </div>

      <div class="field" id="pressingSelectGroup" style="display: none;">
        <label for="pressingSelector">Matching Pressings / Formats</label>
        <select id="pressingSelector"></select>
        <a id="discogsReleaseUrl" class="discogs-link" target="_blank" rel="noopener">View release details ↗</a>
      </div>

      <div>
        <label style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em;">Tracklist</label>
        <ol id="resTracks" class="tracklist"></ol>
      </div>

      <div id="qmcExportActions" class="qmc-export-box">
        <div class="field" style="gap: 4px;">
          <label for="qmcPhotoRole">Captured Photo Usage</label>
          <select id="qmcPhotoRole">
            <option value="cover_fallback">Official Sleeve Art (use snapshot only if unavailable)</option>
            <option value="cover_override">Use Captured Snapshot as Front Sleeve Artwork</option>
            <option value="label_a">Use Captured Snapshot as Side A Center Label</option>
            <option value="label_b">Use Captured Snapshot as Side B Center Label</option>
          </select>
        </div>
        <button id="qmcApplyVisualMatchBtn" type="button" class="btn-qmc-apply">✔ Use This Pressing in QMC Catalogue</button>
      </div>
    </div>
  </div>
</div>

<canvas id="offscreenCanvas"></canvas>

<script>
  const video = document.getElementById('webcam');
  const preview = document.getElementById('preview');
  const canvas = document.getElementById('offscreenCanvas');
  const ctx = canvas.getContext('2d');
  
  const btnToggleCam = document.getElementById('btnToggleCam');
  const btnSnap = document.getElementById('btnSnap');
  const fileInput = document.getElementById('fileInput');
  const btnScan = document.getElementById('btnScan');
  const apiKeyInput = document.getElementById('apiKey');
  const discogsTokenInput = document.getElementById('discogsToken');
  const statusEl = document.getElementById('status');
  
  const resultBlock = document.getElementById('resultBlock');
  const resTitle = document.getElementById('resTitle');
  const resArtist = document.getElementById('resArtist');
  const resTags = document.getElementById('resTags');
  const pressingSelectGroup = document.getElementById('pressingSelectGroup');
  const pressingSelector = document.getElementById('pressingSelector');
  const discogsReleaseUrl = document.getElementById('discogsReleaseUrl');
  const resTracks = document.getElementById('resTracks');

  let stream = null;
  let snappedImageData = null;
  let detectedReleases = [];
  let qmcVisualState = {
    clues: null,
    source: 'discogs',
    selectedIndex: 0,
    fullRelease: null,
    tracks: [],
    coverImage: '',
    snappedPhoto: ''
  };
  window.__qmcVisualState = qmcVisualState;

  if (window.parent !== window || new URLSearchParams(window.location.search).get('embedded') === '1') {
    document.body.classList.add('qmc-embedded');
  }

  apiKeyInput.value = localStorage.getItem('gemini_api_key') || localStorage.getItem('qmc_gemini_api_key') || '';
  apiKeyInput.addEventListener('input', () => {
    const val = apiKeyInput.value.trim();
    localStorage.setItem('gemini_api_key', val);
    localStorage.setItem('qmc_gemini_api_key', val);
  });

  discogsTokenInput.value = localStorage.getItem('discogs_user_token') || localStorage.getItem('qmc_discogs_user_token') || localStorage.getItem('QMC_DISCOGS_TOKEN') || '';
  discogsTokenInput.addEventListener('input', () => {
    const val = discogsTokenInput.value.trim();
    localStorage.setItem('discogs_user_token', val);
    localStorage.setItem('qmc_discogs_user_token', val);
  });

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function stopCamera() {
    if (video.srcObject) {
      video.srcObject.getTracks().forEach(t => t.stop());
      video.srcObject = null;
    }
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
  }

  // Camera start / stop
  btnToggleCam.addEventListener('click', async () => {
    if (stream) {
      stopCamera();
      btnToggleCam.textContent = 'Start Camera';
      btnSnap.disabled = true;
      video.style.display = 'none';
      setStatus('');
      return;
    }

    setStatus('Requesting camera access...');
    const constraints = {
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    };

    try {
      stopCamera();
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      await new Promise(resolve => {
        if (video.readyState >= 1) resolve();
        else video.onloadedmetadata = () => resolve();
      });

      await video.play();
      video.style.display = 'block';
      preview.style.display = 'none';
      snappedImageData = null;
      btnToggleCam.textContent = 'Stop Camera';
      btnSnap.disabled = false;
      btnScan.disabled = true;
      setStatus('Capture sleeve, catalog text, or barcode, then tap "📸 Take Picture"');
    } catch (err) {
      setStatus('Camera error: ' + (err.name || err.message));
    }
  });

  // Freeze frame
  btnSnap.addEventListener('click', () => {
    if (!stream) return;
    snappedImageData = captureDownscaledImage(video, video.videoWidth || 800, video.videoHeight || 800);
    preview.src = snappedImageData;
    preview.style.display = 'block';
    video.style.display = 'none';
    stopCamera();
    btnToggleCam.textContent = 'Retake Photo';
    btnSnap.disabled = true;
    btnScan.disabled = false;
    setStatus('Photo captured. Tap "Identify Release" to search.');
  });

  // Photo library selection
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    stopCamera();
    btnToggleCam.textContent = 'Start Camera';
    btnSnap.disabled = true;
    video.style.display = 'none';

    const reader = new FileReader();
    reader.onload = (event) => {
      preview.src = event.target.result;
      preview.style.display = 'block';
      snappedImageData = event.target.result;
      btnScan.disabled = false;
      setStatus('Photo loaded. Tap "Identify Release" to search.');
    };
    reader.readAsDataURL(file);
  });

  function captureDownscaledImage(sourceEl, sW, sH) {
    const maxDim = 900;
    let targetW = sW;
    let targetH = sH;
    if (targetW > maxDim || targetH > maxDim) {
      if (targetW > targetH) {
        targetH = Math.round((targetH * maxDim) / targetW);
        targetW = maxDim;
      } else {
        targetW = Math.round((targetW * maxDim) / targetH);
        targetH = maxDim;
      }
    }
    canvas.width = targetW;
    canvas.height = targetH;
    ctx.drawImage(sourceEl, 0, 0, targetW, targetH);
    return canvas.toDataURL('image/jpeg', 0.85);
  }

  // --- STAGE 0: Native Barcode Pre-Scan (bypasses LLM on crisp barcode shots) ---
  async function detectBarcodeFromImage(sourceEl) {
    if (typeof window === 'undefined' || !('BarcodeDetector' in window)) return '';
    try {
      const detector = new window.BarcodeDetector({
        formats: ['ean_13', 'upc_a', 'ean_8', 'upc_e', 'code_128', 'code_39']
      });
      const codes = await detector.detect(sourceEl);
      if (Array.isArray(codes) && codes.length > 0) {
        const best = codes.find(c => /^\d{8,14}$/.test(String(c.rawValue || '').trim())) || codes[0];
        return String(best?.rawValue || '').trim();
      }
    } catch (e) {
      console.warn('BarcodeDetector notice:', e);
    }
    return '';
  }

  // --- STAGE 1: Gemini Vision Extraction with 503/429 Backoff & Model Fallback ---
  const GEMINI_EXTRACTION_PROMPT = `Inspect this album cover, vinyl sleeve back, or CD insert closely. Extract all release-identifying details:
1. "artist": Artist or band name
2. "album": Official release title
3. "catno": Catalog number or barcode etched or printed on the sleeve (empty string if none)
4. "label": Record label name (e.g. Ninja Tune, Go! Discs, Big Dada, Factory, 4AD, Warp, London)
5. "year": Stated copyright or release year (empty string if not visible)
6. "format": Inferred format (e.g. "Vinyl, LP", "CD, Album", "12 Inch")
7. "country": Country of manufacture/distribution if printed (e.g. UK, Europe, US)

Return strictly valid JSON matching this schema:
{
  "artist": "string",
  "album": "string",
  "catno": "string",
  "label": "string",
  "year": "string",
  "format": "string",
  "country": "string"
}`;

  const GEMINI_VISION_MODELS = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];

  async function callGeminiVision(base64Jpg, apiKey, modelIndex = 0, retriesLeft = 2) {
    const modelName = GEMINI_VISION_MODELS[modelIndex] || GEMINI_VISION_MODELS[GEMINI_VISION_MODELS.length - 1];
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;

    const payload = {
      contents: [{
        parts: [
          { text: GEMINI_EXTRACTION_PROMPT },
          { inline_data: { mime_type: 'image/jpeg', data: base64Jpg } }
        ]
      }],
      generationConfig: {
        response_mime_type: 'application/json',
        temperature: 0.1
      }
    };

    let res;
    try {
      res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (networkErr) {
      throw new Error('Connection failed. Please check your internet connection or browser ad-blocker.');
    }

    if (res.status === 503 || res.status === 429) {
      if (retriesLeft > 0) {
        const delayMs = retriesLeft === 2 ? 1500 : 3000;
        const sec = (delayMs / 1000).toFixed(1).replace(/\.0$/, '');
        console.warn(`Transient ${res.status} on ${modelName}. Retrying in ${sec}s... (${retriesLeft} left)`);
        setStatus(`${modelName} busy (${res.status}). Retrying in ${sec}s...`);
        await new Promise(resolve => setTimeout(resolve, delayMs));
        return callGeminiVision(base64Jpg, apiKey, modelIndex, retriesLeft - 1);
      }
      if (modelIndex + 1 < GEMINI_VISION_MODELS.length) {
        const nextModel = GEMINI_VISION_MODELS[modelIndex + 1];
        console.warn(`${modelName} overloaded (${res.status}). Falling back to ${nextModel}...`);
        setStatus(`${modelName} busy — switching to ${nextModel}...`);
        return callGeminiVision(base64Jpg, apiKey, modelIndex + 1, 1);
      }
    }

    if ((res.status === 404 || res.status === 400) && modelIndex + 1 < GEMINI_VISION_MODELS.length) {
      const nextModel = GEMINI_VISION_MODELS[modelIndex + 1];
      console.warn(`${modelName} unavailable (${res.status}). Trying ${nextModel}...`);
      setStatus(`${modelName} unavailable — trying ${nextModel}...`);
      return callGeminiVision(base64Jpg, apiKey, modelIndex + 1, 1);
    }

    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) {
      throw new Error(data.error?.message || `Gemini API HTTP ${res.status}`);
    }

    const raw = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!raw) throw new Error('No recognition data returned.');
    const cleanedJson = String(raw).trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
    return JSON.parse(cleanedJson);
  }

  async function extractVisualCluesWithGemini(apiKey, base64Jpg) {
    return callGeminiVision(base64Jpg, apiKey, 0, 2);
  }

  // --- STAGE 2: Multi-Release Resolver ---
  async function resolvePressings(clues, discogsToken) {
    if (discogsToken) {
      try {
        const discogsResults = await queryDiscogs(clues, discogsToken);
        if (discogsResults && discogsResults.length > 0) {
          return { source: 'discogs', list: discogsResults };
        }
      } catch (e) {
        console.warn('Discogs query fallback:', e);
      }
    }

    const mbResults = await queryMusicBrainzReleases(clues.artist, clues.album, clues.barcode || (/^\d{8,14}$/.test(String(clues.catno || '').trim()) ? String(clues.catno).trim() : ''));
    return { source: 'musicbrainz', list: mbResults };
  }

  async function queryDiscogs(clues, token) {
    const cleanBc = String(clues.barcode || (/^\d{8,14}$/.test(String(clues.catno || '').trim()) ? clues.catno : '')).replace(/\D/g, '');
    if (cleanBc) {
      const bcUrl = `https://api.discogs.com/database/search?barcode=${encodeURIComponent(cleanBc)}&type=release&per_page=15&token=${token}`;
      const bcRes = await fetch(bcUrl, { headers: { 'User-Agent': 'VinylCoverMatcher/2.0' } });
      if (bcRes.ok) {
        const bcData = await bcRes.json();
        if (Array.isArray(bcData.results) && bcData.results.length > 0) {
          return bcData.results.map(formatDiscogsItem);
        }
      }
    }

    if (!clues.album && !clues.artist && !clues.catno) return [];

    let q = `release_title=${encodeURIComponent(clues.album || '')}&artist=${encodeURIComponent(clues.artist || '')}`;
    if (clues.catno && !cleanBc) q += `&catno=${encodeURIComponent(clues.catno)}`;
    if (clues.label) q += `&label=${encodeURIComponent(clues.label)}`;

    const url = `https://api.discogs.com/database/search?${q}&type=release&per_page=15&token=${token}`;
    const res = await fetch(url, { headers: { 'User-Agent': 'VinylCoverMatcher/2.0' } });
    if (!res.ok) throw new Error(`Discogs search error HTTP ${res.status}`);

    const data = await res.json();
    if (!data.results || data.results.length === 0) {
      const broadUrl = `https://api.discogs.com/database/search?release_title=${encodeURIComponent(clues.album || '')}&artist=${encodeURIComponent(clues.artist || '')}&type=release&per_page=15&token=${token}`;
      const broadRes = await fetch(broadUrl, { headers: { 'User-Agent': 'VinylCoverMatcher/2.0' } });
      const broadData = await broadRes.json();
      return (broadData.results || []).map(formatDiscogsItem);
    }
    return data.results.map(formatDiscogsItem);
  }

  function formatDiscogsItem(r) {
    return {
      id: r.id,
      title: r.title,
      year: r.year || 'Unknown Year',
      country: r.country || 'Unknown Country',
      format: (r.format || []).join(', ') || 'Vinyl',
      catno: r.catno || 'No Cat #',
      label: (r.label || [])[0] || 'Unknown Label',
      barcode: Array.isArray(r.barcode) ? (r.barcode[0] || '') : (r.barcode || ''),
      genre: Array.isArray(r.genre) ? r.genre : [],
      style: Array.isArray(r.style) ? r.style : [],
      coverImage: r.cover_image || r.thumb || '',
      uri: `https://www.discogs.com${r.uri || '/release/' + r.id}`
    };
  }

  async function queryMusicBrainzReleases(artist, album, barcode = '') {
    const cleanBc = String(barcode || '').replace(/\D/g, '');
    const rawQuery = cleanBc
      ? `barcode:${cleanBc}`
      : `release:"${album || ''}" AND artist:"${artist || ''}"`;
    const q = encodeURIComponent(rawQuery);
    const url = `https://musicbrainz.org/ws/2/release/?query=${q}&fmt=json&limit=15`;
    const res = await fetch(url, { headers: { 'User-Agent': 'VinylCoverMatcher/2.0 ( contact@queensferrymusiccollective.co.uk )' } });
    if (!res.ok) return [];
    const data = await res.json();
    return (data.releases || []).map(r => {
      const rArtist = r['artist-credit']?.[0]?.name || artist || 'Unknown Artist';
      return {
        id: r.id,
        title: `${rArtist} - ${r.title}`,
        year: r.date ? r.date.split('-')[0] : 'Unknown Year',
        country: r.country || 'Worldwide',
        format: r.media?.[0]?.format || 'Format Unknown',
        catno: r['label-info']?.[0]?.['catalog-number'] || 'N/A',
        label: r['label-info']?.[0]?.label?.name || 'N/A',
        barcode: r.barcode || cleanBc || '',
        coverImage: `https://coverartarchive.org/release/${r.id}/front-500`,
        uri: `https://musicbrainz.org/release/${r.id}`
      };
    });
  }

  // --- STAGE 3: Full Tracklist & Release Details Retrieval ---
  async function fetchTracklist(source, releaseId, discogsToken) {
    resTracks.innerHTML = '<li>Loading tracklist...</li>';
    qmcVisualState.fullRelease = null;
    qmcVisualState.tracks = [];

    if (source === 'discogs' && discogsToken) {
      try {
        const url = `https://api.discogs.com/releases/${releaseId}?token=${discogsToken}`;
        const res = await fetch(url, { headers: { 'User-Agent': 'VinylCoverMatcher/2.0' } });
        if (res.ok) {
          const d = await res.json();
          qmcVisualState.fullRelease = d;
          const dcImg = (d.images && (d.images.find(img => img.type === 'primary') || d.images[0])) || null;
          if (dcImg?.uri || dcImg?.resource_url) {
            qmcVisualState.coverImage = dcImg.uri || dcImg.resource_url;
          }
          const structured = (d.tracklist || []).map(t => ({
            pos: t.position || '',
            title: t.title || '',
            duration: t.duration || ''
          }));
          qmcVisualState.tracks = structured;
          renderTracks(structured);
          return;
        }
      } catch (e) {
        console.warn('Failed Discogs details fetch:', e);
      }
    }

    try {
      const url = `https://musicbrainz.org/ws/2/release/${releaseId}?inc=recordings+labels+tags&fmt=json`;
      const res = await fetch(url, { headers: { 'User-Agent': 'VinylCoverMatcher/2.0 ( contact@queensferrymusiccollective.co.uk )' } });
      const d = await res.json();
      qmcVisualState.fullRelease = d;
      const tracks = d.media?.[0]?.tracks || [];
      const structured = tracks.map((t, idx) => ({
        pos: String(t.number || idx + 1),
        title: t.title,
        duration: t.length ? `${Math.floor(t.length/60000)}:${String(Math.floor((t.length%60000)/1000)).padStart(2,'0')}` : ''
      }));
      qmcVisualState.tracks = structured;
      renderTracks(structured);
    } catch (e) {
      resTracks.innerHTML = '<li>Tracklist unavailable.</li>';
    }
  }

  function renderTracks(list) {
    resTracks.innerHTML = '';
    if (!list || list.length === 0) {
      resTracks.innerHTML = '<li>No tracks listed for this release.</li>';
      return;
    }
    list.forEach(t => {
      const li = document.createElement('li');
      li.innerHTML = `<span><strong>${t.pos ? t.pos + '. ' : ''}</strong>${t.title}</span><span class="track-dur">${t.duration || ''}</span>`;
      resTracks.appendChild(li);
    });
  }

  // Orchestrate Scan
  btnScan.addEventListener('click', async () => {
    const key = apiKeyInput.value.trim();
    const discogsToken = discogsTokenInput.value.trim();

    btnScan.disabled = true;
    resultBlock.style.display = 'none';
    setStatus('Optimizing photo...');

    let finalDataUrl = snappedImageData;
    if (!finalDataUrl.startsWith('data:image/jpeg;base64') || preview.naturalWidth > 900) {
      finalDataUrl = captureDownscaledImage(preview, preview.naturalWidth, preview.naturalHeight);
    }
    const rawBase64 = finalDataUrl.split(',')[1];

    try {
      qmcVisualState.snappedPhoto = finalDataUrl;
      qmcVisualState.coverImage = '';
      qmcVisualState.fullRelease = null;
      qmcVisualState.tracks = [];

      let clues = null;
      let preResolved = null;

      // Step 1: Try native barcode scan first to bypass Gemini on crisp barcode shots
      setStatus('Checking for barcode...');
      const detectedBarcode = await detectBarcodeFromImage(preview);
      if (detectedBarcode) {
        setStatus(`Detected barcode ${detectedBarcode} — searching ${discogsToken ? 'Discogs' : 'MusicBrainz'} directly...`);
        const bcClues = { artist: '', album: '', catno: detectedBarcode, barcode: detectedBarcode, label: '', year: '', format: '', country: '' };
        const bcRes = await resolvePressings(bcClues, discogsToken);
        if (bcRes.list && bcRes.list.length > 0) {
          preResolved = bcRes;
          const firstTitle = String(bcRes.list[0].title || '');
          const splitIdx = firstTitle.indexOf(' - ');
          clues = {
            artist: splitIdx > 0 ? firstTitle.slice(0, splitIdx).trim() : '',
            album: splitIdx > 0 ? firstTitle.slice(splitIdx + 3).trim() : firstTitle,
            catno: bcRes.list[0].catno && bcRes.list[0].catno !== 'No Cat #' ? bcRes.list[0].catno : detectedBarcode,
            barcode: detectedBarcode,
            label: bcRes.list[0].label !== 'Unknown Label' ? bcRes.list[0].label : '',
            year: bcRes.list[0].year !== 'Unknown Year' ? String(bcRes.list[0].year) : '',
            format: bcRes.list[0].format || '',
            country: bcRes.list[0].country !== 'Unknown Country' ? bcRes.list[0].country : ''
          };
        }
      }

      // Step 2: Gemini Vision extraction with automatic 503/429 retry + model fallback
      if (!clues) {
        if (!key) {
          alert('No readable barcode detected — please enter your Gemini API Key at the top to identify sleeve artwork.');
          btnScan.disabled = false;
          setStatus('');
          return;
        }
        setStatus(`Reading sleeve typography & catalog clues via ${GEMINI_VISION_MODELS[0]}...`);
        clues = await extractVisualCluesWithGemini(key, rawBase64);
      }

      qmcVisualState.clues = clues;
      resTitle.textContent = clues.album || 'Unknown Album';
      resArtist.textContent = clues.artist || 'Unknown Artist';

      resTags.innerHTML = '';
      if (clues.year) resTags.innerHTML += `<span class="tag">Year: ${clues.year}</span>`;
      if (clues.label) resTags.innerHTML += `<span class="tag">Label: ${clues.label}</span>`;
      if (clues.catno) resTags.innerHTML += `<span class="tag tag-cat">Cat/Barcode: ${clues.catno}</span>`;
      if (clues.format) resTags.innerHTML += `<span class="tag">${clues.format}</span>`;
      if (clues.country) resTags.innerHTML += `<span class="tag">${clues.country}</span>`;

      let source, list;
      if (preResolved) {
        ({ source, list } = preResolved);
      } else {
        setStatus(`Searching ${discogsToken ? 'Discogs' : 'MusicBrainz'} for pressings...`);
        ({ source, list } = await resolvePressings(clues, discogsToken));
      }
      detectedReleases = list;
      qmcVisualState.source = source;
      qmcVisualState.detectedReleases = list;

      if (detectedReleases.length > 0) {
        pressingSelector.innerHTML = '';
        detectedReleases.forEach((rel, index) => {
          const opt = document.createElement('option');
          opt.value = index;
          opt.textContent = `${rel.year} • ${rel.country} • ${rel.format} • ${rel.label} [${rel.catno}]`;
          pressingSelector.appendChild(opt);
        });

        pressingSelectGroup.style.display = 'block';
        updateSelectedRelease(source, 0, discogsToken);

        pressingSelector.onchange = (e) => {
          updateSelectedRelease(source, e.target.value, discogsToken);
        };
      } else {
        pressingSelectGroup.style.display = 'none';
        resTracks.innerHTML = '<li>No exact pressings found matching these parameters.</li>';
      }

      resultBlock.style.display = 'flex';
      setStatus('');
    } catch (err) {
      setStatus('Error: ' + err.message);
    } finally {
      btnScan.disabled = false;
    }
  });

  function updateSelectedRelease(source, index, discogsToken) {
    const item = detectedReleases[index];
    if (!item) return;
    qmcVisualState.selectedIndex = Number(index) || 0;
    qmcVisualState.coverImage = item.coverImage || '';
    discogsReleaseUrl.href = item.uri;
    discogsReleaseUrl.textContent = `View release on ${source === 'discogs' ? 'Discogs' : 'MusicBrainz'} ↗`;
    fetchTracklist(source, item.id, discogsToken);
  }

  function buildQmcExportPayload() {
    const idx = parseInt(pressingSelector.value || qmcVisualState.selectedIndex || '0', 10);
    const chosen = detectedReleases[idx] || detectedReleases[0] || null;
    const clues = qmcVisualState.clues || {};
    const full = qmcVisualState.fullRelease || null;
    const source = qmcVisualState.source || 'discogs';

    const cleanStr = (s) => (s && !/^(Unknown|No Cat #|N\/A|Format Unknown|Worldwide)/i.test(String(s).trim())) ? String(s).trim() : '';
    let artist = cleanStr(clues.artist) || resArtist.textContent.trim();
    let title = cleanStr(clues.album) || resTitle.textContent.trim();
    if (full) {
      if (Array.isArray(full.artists) && full.artists[0]?.name) {
        artist = full.artists[0].name.replace(/\s*\(\d+\)$/, '').trim();
      } else if (Array.isArray(full['artist-credit']) && full['artist-credit'][0]?.name) {
        artist = full['artist-credit'][0].name.trim();
      }
      if (full.title) title = String(full.title).trim();
    } else if (chosen?.title && chosen.title.includes(' - ')) {
      const parts = chosen.title.split(' - ');
      if (!artist) artist = parts[0].trim();
      title = parts.slice(1).join(' - ').trim();
    }

    const dcLabel = full?.labels?.[0] || full?.['label-info']?.[0];
    const label = cleanStr(dcLabel?.name || dcLabel?.label?.name) || cleanStr(chosen?.label) || cleanStr(clues.label);
    const catNo = cleanStr(dcLabel?.catno || dcLabel?.['catalog-number']) || cleanStr(chosen?.catno) || cleanStr(clues.catno);
    const yearRaw = full?.year || (full?.date ? full.date.split('-')[0] : '') || cleanStr(chosen?.year) || cleanStr(clues.year);
    const year = /^\d{4}$/.test(String(yearRaw)) ? String(yearRaw) : '';
    const country = cleanStr(full?.country) || cleanStr(chosen?.country) || cleanStr(clues.country);
    const format = cleanStr(chosen?.format) || cleanStr(clues.format);
    const rawFormats = full?.formats || full?.media || format;
    const discogsId = (source === 'discogs' && (full?.id || chosen?.id)) ? String(full?.id || chosen?.id) : '';

    const identifiers = Array.isArray(full?.identifiers) ? full.identifiers : [];
    const barcodeId = identifiers.find(i => /barcode/i.test(i.type || ''));
    const barcode = cleanStr(barcodeId?.value) || cleanStr(full?.barcode) || cleanStr(chosen?.barcode) || (/^\d{8,14}$/.test(cleanStr(clues.catno)) ? cleanStr(clues.catno) : '');
    const matrixIds = identifiers.filter(i => /matrix|runout|etch/i.test(i.type || ''));
    const matrixA = matrixIds[0]?.value ? String(matrixIds[0].value).trim() : '';
    const matrixB = matrixIds[1]?.value ? String(matrixIds[1].value).trim() : '';

    const genresList = Array.isArray(full?.genres) && full.genres.length > 0 ? full.genres : (Array.isArray(chosen?.genre) ? chosen.genre : []);
    const stylesList = Array.isArray(full?.styles) && full.styles.length > 0 ? full.styles : (Array.isArray(chosen?.style) ? chosen.style : []);
    const genre = genresList[0] || '';
    const styles = stylesList;

    const seriesObj = Array.isArray(full?.series) && full.series[0] ? full.series[0] : null;
    const seriesName = seriesObj?.name ? String(seriesObj.name).trim() : '';
    const seriesNumber = seriesObj?.catno ? String(seriesObj.catno).trim() : '';

    const photoRole = document.getElementById('qmcPhotoRole')?.value || 'cover_fallback';
    const snapped = qmcVisualState.snappedPhoto || snappedImageData || '';
    let coverImage = qmcVisualState.coverImage || chosen?.coverImage || '';
    let labelAImage = '';
    let labelBImage = '';
    if (photoRole === 'cover_override' && snapped) coverImage = snapped;
    else if (photoRole === 'label_a' && snapped) labelAImage = snapped;
    else if (photoRole === 'label_b' && snapped) labelBImage = snapped;
    else if (!coverImage && snapped) coverImage = snapped;

    const tracks = Array.isArray(qmcVisualState.tracks) && qmcVisualState.tracks.length > 0
      ? qmcVisualState.tracks
      : Array.from(resTracks.querySelectorAll('li')).map(li => li.textContent.trim()).filter(t => t && !/loading tracklist|no tracks|unavailable|no exact pressings/i.test(t));

    return {
      source,
      sourceUrl: chosen?.uri || discogsReleaseUrl.href || '',
      artist,
      title,
      label,
      catNo,
      year,
      country,
      format,
      rawFormats,
      discogsId,
      barcode,
      genre,
      styles,
      seriesName,
      seriesNumber,
      matrixA,
      matrixB,
      tracks,
      coverImage,
      labelAImage,
      labelBImage,
      researchNotes: full?.notes ? String(full.notes).trim().slice(0, 600) : ''
    };
  }

  function exitVisualPage() {
    stopCamera();
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'QMC_VISUAL_EXIT' }, '*');
      return;
    }
    if (window.opener && !window.opener.closed) {
      try { window.opener.focus(); } catch (e) {}
    }
    try { window.close(); } catch (e) {}
    setTimeout(() => {
      if (!window.closed) {
        if (window.history.length > 1 && document.referrer && document.referrer.includes('catalogue')) {
          window.history.back();
        } else {
          window.location.href = 'index.html';
        }
      }
    }, 150);
  }

  document.getElementById('btnExitVisual')?.addEventListener('click', exitVisualPage);

  document.getElementById('qmcApplyVisualMatchBtn')?.addEventListener('click', () => {
    const payload = buildQmcExportPayload();
    stopCamera();
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'QMC_VISUAL_MATCH', payload }, '*');
      setStatus('Sent pressing to QMC Catalogue!');
      return;
    }
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: 'QMC_VISUAL_MATCH', payload }, '*');
      try { window.opener.focus(); } catch (e) {}
      setStatus('Sent pressing to open QMC Catalogue window!');
      setTimeout(() => { try { window.close(); } catch (e) {} }, 120);
      return;
    }
    try {
      const storagePayload = { ...payload };
      if ((storagePayload.coverImage || '').startsWith('data:') && storagePayload.coverImage.length > 300000) storagePayload.coverImage = '';
      if ((storagePayload.labelAImage || '').startsWith('data:') && storagePayload.labelAImage.length > 300000) storagePayload.labelAImage = '';
      if ((storagePayload.labelBImage || '').startsWith('data:') && storagePayload.labelBImage.length > 300000) storagePayload.labelBImage = '';
      localStorage.setItem('qmc_visual_match_payload', JSON.stringify(storagePayload));
      setStatus('Saved pressing — returning to QMC Catalogue...');
      setTimeout(() => { window.location.href = 'index.html'; }, 120);
    } catch (e) {
      setStatus('Pressing ready — open QMC Catalogue in this browser to import.');
    }
  });

  window.addEventListener('message', (event) => {
    if (event?.data?.type === 'QMC_VISUAL_CLOSE') {
      stopCamera();
    }
  });
  window.addEventListener('pagehide', stopCamera);
</script>
